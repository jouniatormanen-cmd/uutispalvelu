name: Update Finnish news
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
concurrency:
  group: news-collection
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch feeds
        run: |
          python scripts/fetch_news.py
          python scripts/fetch_authorities.py
      - name: Commit news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json viranomaiset/news.json
          git diff --cached --quiet || (git commit -m "Update Finnish headlines" && (git push || (git pull --rebase && git push)))
