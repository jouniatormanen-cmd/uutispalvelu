name: Update Finnish news
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
concurrency:
  group: news-collection
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch feeds
        run: |
          python scripts/fetch_news.py &
          p1=$!
          python scripts/fetch_authorities.py &
          p2=$!
          python scripts/fetch_warnings.py &
          p3=$!
          r1=0; wait "$p1" || r1=$?
          r2=0; wait "$p2" || r2=$?
          r3=0; wait "$p3" || r3=$?
          echo "Collector results: general=$r1 authority=$r2 warnings=$r3"
          test "$r1" -eq 0 && test "$r2" -eq 0 && test "$r3" -eq 0
      - name: Validate collected authority news
        run: |
          python - <<'PY'
          import json, datetime as dt
          with open("viranomaiset/news.json", encoding="utf-8") as f:
              data = json.load(f)
          items = data.get("items", [])
          checks = data.get("monitoring", [])
          working = [s["source"] for s in checks if s.get("fetched", 0) > 0]
          print(f"Authority news: {len(items)} saved, {len(working)}/{len(checks)} sources returned items")
          for source in checks:
              print(f"  {source['source']}: {source.get('status')} ({source.get('fetched', 0)} entries)")
          if not items or not working:
              raise SystemExit("No authority news available: check sources before publishing")
          updated = dt.datetime.fromisoformat(data["updated"])
          if dt.datetime.now(dt.timezone.utc) - updated > dt.timedelta(minutes=15):
              raise SystemExit("Authority news data was not refreshed")
          PY
      - name: Commit news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json viranomaiset/news.json viranomaiset/archive.json viranomaiset/warnings.json
          git diff --cached --quiet || (git commit -m "Update Finnish headlines" && (git push || (git pull --rebase && git push)))
