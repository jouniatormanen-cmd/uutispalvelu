function category(t){let s=t.toLowerCase();if(/urheil|jääkiek|jalkapall|liiga|olympia/.test(s))return 6;if(/talou|euro|pörssi|yrity|raha/.test(s))return 3;if(/eduskun|hallitu|minister|vaal|puolue/.test(s))return 4;if(/viih|elokuva|musiik|julkk|artisti/.test(s))return 5;if(/tekoäly|teknolog|tietokon|puhelin|sovellu/.test(s))return 7;if(/tervey|sairaal|lääkä|hoito/.test(s))return 8;if(/liikenn|juna|tie|bussi/.test(s))return 9;if(/onnettom|tulipal|kolari|poliisi/.test(s))return 10;if(/ulkomaa|yhdysvall|ukrain|venäj|kiina|trump/.test(s))return 2;return 1}
function render(){const d=dict[$("lang").value],q=$("search").value.trim().toLocaleLowerCase("fi"),reg=$("region").value,src=$("source").value,place=$("place").value.trim().toLocaleLowerCase("fi"),exclude=$("exclude").value.toLocaleLowerCase("fi").split(/[,\s]+/).filter(Boolean),words=q.split(/\s+/).filter(Boolean),mode=$("match").value,age=Number($("age").value),sort=$("sort").value,now=Date.now();$("tagline").textContent=d.tag;$("search").placeholder=d.search;$("search").setAttribute("aria-label",d.search);$("refresh").textContent=d.refresh;$("foot").textContent=d.foot;$("region").options[0].text=d.country;$("source").options[0].text=d.all;for(const [id,key] of [["advancedTitle","advanced"],["wordsLabel","words"],["excludeLabel","exclude"],["timeLabel","time"],["sortLabel","sort"],["placeLabel","place"]])$(id).textContent=d[key];$("tabs").replaceChildren(...d.cats.map((c,i)=>{let b=document.createElement("button");b.textContent=c;b.className=i===active?"active":"";b.onclick=()=>{active=i;render()};return b}));let filtered=news.filter(n=>{let text=(n.title+" "+n.source).toLocaleLowerCase("fi"),title=n.title.toLocaleLowerCase("fi");if(words.length&&!(mode==="exact"?text.includes(q):mode==="any"?words.some(w=>text.includes(w)):words.every(w=>text.includes(w))))return false;if(exclude.some(w=>text.includes(w)))return false;if(src&&n.source!==src)return false;if(active&&n.category!==active)return false;if(reg){const placeWords={uusimaa:["uusimaa","helsinki","espoo","vantaa","porvoo","sipoo","kerava","järvenpää","lohja","hyvinkää"],"ita-uusimaa":["itä-uusimaa","porvoo","sipoo","loviisa","askola","lapinjärvi","myrskylä","pukkila"],helsinki:["helsinki","helsingin"],porvoo:["porvoo","porvoon"],turku:["turku","turun"],tampere:["tampere","tampereen"],oulu:["oulu","oulun"]};let tags=placeWords[reg]||[reg];if(!(n.region===reg||(reg==="uusimaa"&&["ita-uusimaa","helsinki","porvoo"].includes(n.region))||tags.some(w=>title.includes(w))))return false}if(place&&!title.includes(place))return false;if(age&&(!n.date||now-new Date(n.date).getTime()>age*3600000))return false;return true});filtered.sort((a,b)=>sort==="source"?a.source.localeCompare(b.source,"fi"):(sort==="old"?1:-1)*(new Date(a.date)-new Date(b.date)));$("stories").replaceChildren(...filtered.map(n=>{let card=document.createElement("article");card.className="story";let a=document.createElement("a");a.href=n.link;a.target="_blank";a.rel="noopener noreferrer";a.textContent=n.title;let meta=document.createElement("div");meta.className="meta";meta.textContent=n.source+" · "+(n.date?new Date(n.date).toLocaleString("fi-FI"):"")+" · "+d.cats[n.category];card.append(a,meta);return card}));$("count").textContent=filtered.length+" / "+news.length;$("status").textContent=news.length?(filtered.length?"":d.empty):errors===feeds.length?d.fail:d.loading}
