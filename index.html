<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uutispalvelu – Suomen uutiset</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#152336;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}header{background:#102b4a;color:white;padding:18px max(16px,calc((100% - 1100px)/2))}header h1{margin:0;font-size:27px}header p{margin:5px 0;color:#c7d7e8}main{max-width:1100px;margin:auto;padding:16px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}input,select,button{border:1px solid #cbd5e1;border-radius:9px;padding:12px;font:inherit;background:white;color:#172b44}input{flex:2;min-width:180px}select{flex:1;min-width:130px}button{cursor:pointer}.tabs{display:flex;overflow:auto;gap:8px;padding-bottom:10px}.tabs button{white-space:nowrap}.tabs button.active{background:#123b67;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.story{background:white;border:1px solid #dfe6ee;border-radius:12px;padding:16px}.story a{color:#122f51;font-size:18px;font-weight:700;text-decoration:none}.story a:hover{text-decoration:underline}.meta{color:#64748b;font-size:13px;margin-top:12px}.status{padding:14px 0;color:#475569}footer{text-align:center;color:#64748b;padding:35px 12px}#count{font-size:14px;color:#64748b} @media(max-width:500px){header h1{font-size:24px}.controls{display:grid;grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1;width:100%}.controls select{min-width:0;width:100%}}
</style></head><body><header><h1 id="brand">Uutispalvelu</h1><p id="tagline">Suomen uutiset yhdestä paikasta</p></header><main><div class="controls"><input id="search" type="search" placeholder="Hae uutisia" aria-label="Hae uutisia"><select id="region" aria-label="Alue"><option value="">Koko Suomi</option><option value="uusimaa">Uusimaa</option><option value="ita-uusimaa">Itä-Uusimaa</option><option value="helsinki">Helsinki</option><option value="porvoo">Porvoo</option><option value="turku">Turku</option><option value="tampere">Tampere</option><option value="oulu">Oulu</option></select><select id="source" aria-label="Lähde"><option value="">Kaikki lähteet</option></select><select id="lang" aria-label="Language"><option value="fi">Suomi</option><option value="sv">Svenska</option><option value="en">English</option></select></div><nav class="tabs" id="tabs" aria-label="Aiheet"></nav><div class="controls"><button id="refresh">Päivitä uutiset</button><span id="count"></span></div><div id="status" class="status" role="status">Ladataan uutisia…</div><section class="grid" id="stories"></section></main><footer id="foot">Otsikot johtavat alkuperäisiin suomalaisiin uutismedioihin. Uutisia ei käännetä.</footer><script>
const feeds=[{name:"Yle",url:"https://feeds.yle.fi/uutiset/v1/recent.rss?publisherIds=YLE_UUTISET",region:""},{name:"Yle Uusimaa",url:"https://feeds.yle.fi/uutiset/v1/recent.rss?publisherIds=YLE_UUTISET_UUSIMAA",region:"uusimaa"},{name:"Yle Itä-Uusimaa",url:"https://feeds.yle.fi/uutiset/v1/recent.rss?publisherIds=YLE_UUTISET_ITA_UUSIMAA",region:"ita-uusimaa"},{name:"Ilta-Sanomat",url:"https://www.is.fi/rss/tuoreimmat.xml",region:""},{name:"MTV Uutiset",url:"https://www.mtvuutiset.fi/rss",region:""}];
const categories=["Kaikki","Kotimaa","Ulkomaat","Talous","Politiikka","Viihde","Urheilu","Teknologia","Terveys","Liikenne","Onnettomuudet"];
const dict={fi:{tag:"Suomen uutiset yhdestä paikasta",search:"Hae uutisia",all:"Kaikki lähteet",country:"Koko Suomi",refresh:"Päivitä uutiset",loading:"Ladataan uutisia…",empty:"Uutisia ei löytynyt. Kokeile toista hakua tai suodatinta.",fail:"Uutislähteitä ei saatu ladattua. Kokeile päivittää myöhemmin.",foot:"Otsikot johtavat alkuperäisiin suomalaisiin uutismedioihin. Uutisia ei käännetä.",cats:categories},sv:{tag:"Finlands nyheter på ett ställe",search:"Sök nyheter",all:"Alla källor",country:"Hela Finland",refresh:"Uppdatera nyheter",loading:"Laddar nyheter…",empty:"Inga nyheter hittades.",fail:"Nyhetskällorna kunde inte hämtas. Försök senare.",foot:"Rubrikerna länkar till finländska medier. Artiklarna översätts inte.",cats:["Alla","Inrikes","Utrikes","Ekonomi","Politik","Nöje","Sport","Teknik","Hälsa","Trafik","Olyckor"]},en:{tag:"Finnish news in one place",search:"Search news",all:"All sources",country:"All Finland",refresh:"Refresh news",loading:"Loading news…",empty:"No matching news found.",fail:"News feeds could not be loaded. Try again later.",foot:"Headlines link to original Finnish media. Articles are not translated.",cats:["All","Domestic","World","Business","Politics","Entertainment","Sports","Technology","Health","Traffic","Accidents"]}};
let news=[],active=0,errors=0;
const $=id=>document.getElementById(id);
function category(t){let s=t.toLowerCase();if(/urheil|jääkiek|jalkapall|liiga|olympia/.test(s))return 6;if(/talou|euro|pörssi|yrity|raha/.test(s))return 3;if(/eduskun|hallitu|minister|vaal|puolue/.test(s))return 4;if(/viih|elokuva|musiik|julkk|artisti/.test(s))return 5;if(/tekoäly|teknolog|tietokon|puhelin|sovellu/.test(s))return 7;if(/tervey|sairaal|lääkä|hoito/.test(s))return 8;if(/liikenn|juna|tie|bussi/.test(s))return 9;if(/onnettom|tulipal|kolari|poliisi/.test(s))return 10;if(/ulkomaa|yhdysvall|ukrain|venäj|kiina|trump/.test(s))return 2;return 1}
function render(){let d=dict[$("lang").value],q=$("search").value.toLocaleLowerCase("fi"),reg=$("region").value,src=$("source").value;$("tagline").textContent=d.tag;$("search").placeholder=d.search;$("search").setAttribute("aria-label",d.search);$("refresh").textContent=d.refresh;$("foot").textContent=d.foot;$("region").options[0].text=d.country;$("source").options[0].text=d.all;$("tabs").replaceChildren(...d.cats.map((c,i)=>{let b=document.createElement("button");b.textContent=c;b.className=i===active?"active":"";b.onclick=()=>{active=i;render()};return b}));let filtered=news.filter(n=>(!q||(n.title+" "+n.source).toLocaleLowerCase("fi").includes(q))&&(!src||n.source===src)&&(!active||n.category===active)&&(!reg||n.region===reg||(reg==="uusimaa"&&["ita-uusimaa","helsinki","porvoo"].includes(n.region))||(reg==="ita-uusimaa"&&n.region==="porvoo")));$("stories").replaceChildren(...filtered.map(n=>{let card=document.createElement("article");card.className="story";let a=document.createElement("a");a.href=n.link;a.target="_blank";a.rel="noopener noreferrer";a.textContent=n.title;let meta=document.createElement("div");meta.className="meta";meta.textContent=n.source+" · "+(n.date?new Date(n.date).toLocaleString("fi-FI"):"");card.append(a,meta);return card}));$("count").textContent=filtered.length+" / "+news.length;$("status").textContent=news.length?(filtered.length?"":d.empty):errors===feeds.length?d.fail:d.loading}
async function load(){news=[];errors=0;render();const results=await Promise.allSettled(feeds.map(async f=>{const proxy="https://api.allorigins.win/raw?url="+encodeURIComponent(f.url);const response=await fetch(proxy,{signal:AbortSignal.timeout(12000)});if(!response.ok)throw Error("HTTP "+response.status);const xml=new DOMParser().parseFromString(await response.text(),"application/xml");if(xml.querySelector("parsererror"))throw Error("Invalid RSS");return [...xml.querySelectorAll("item")].slice(0,70).map(item=>({title:item.querySelector("title")?.textContent?.trim()||"",link:item.querySelector("link")?.textContent?.trim()||"",date:item.querySelector("pubDate")?.textContent||"",source:f.name,region:f.region})).filter(x=>x.title&&/^https:\/\//.test(x.link))}));let seen=new Set;for(let i=0;i<results.length;i++){let r=results[i];if(r.status==="rejected"){errors++;continue}for(let n of r.value){let key=n.title.toLocaleLowerCase("fi").replace(/[^a-zåäö0-9]/g,"").slice(0,75);if(!seen.has(key)){seen.add(key);n.category=category(n.title);news.push(n)}}}news.sort((a,b)=>new Date(b.date)-new Date(a.date));$("source").replaceChildren(new Option(dict[$("lang").value].all,""),...[...new Set(news.map(n=>n.source))].map(s=>new Option(s,s)));render()}
$("search").oninput=render;$("region").onchange=render;$("source").onchange=render;$("lang").onchange=render;$("refresh").onclick=load;render();load();
</script></body></html>
